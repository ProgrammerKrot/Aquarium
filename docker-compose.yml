services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       companion
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d companion"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/companion
      PGHOST: db
      PGPORT: "5432"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./client:/app/client
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
