name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          envs: GH_PAT
          script: |
            set -e

            # Ensure git is installed
            if ! command -v git &>/dev/null; then
              apt-get update -qq
              apt-get install -y -qq git
            fi

            # Clone repo on first run, or pull latest changes
            REPO_URL="https://${GH_PAT}@github.com/ProgrammerKrot/Aquarium.git"
            if [ ! -d "/opt/aquarium/.git" ]; then
              git clone "$REPO_URL" /opt/aquarium
            fi

            cd /opt/aquarium
            git fetch "https://${GH_PAT}@github.com/ProgrammerKrot/Aquarium.git" main
            git reset --hard FETCH_HEAD

            # Rebuild and restart containers
            docker compose down --remove-orphans
            docker compose up --build -d

            # Wait a moment and show running containers
            sleep 5
            docker compose ps
